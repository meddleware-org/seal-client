name: Live checks

# Read-only checks against public testnet (no secrets): the ABI of every seal_policies builder against the
# recorded published-at, event decoding against real events, and a time-lock round trip over the independent
# key servers. Weekly, because a seal_policies republish, a key-server change or a fullnode change shows up
# here before it breaks a user.

on:
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Testnet suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: Live suite
        run: npm run test:integration
