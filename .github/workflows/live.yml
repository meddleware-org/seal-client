name: Live checks

# Read-only checks against public testnet (no secrets): the ABI of every seal_policies builder against the
# recorded published-at, event decoding against real events, and a time-lock round trip over the independent
# key servers. Weekly, because a seal_policies republish, a key-server change or a fullnode change shows up
# here before it breaks a user. The funded nft-gate round trip with negatives (tests/integration/nft-gate.integration.test.ts)
# is maintainer-run and skips here: it needs a funded testnet key, which must never be a CI secret (README, "Live nft-gate round trip").

on:
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Testnet suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: npm ci
      - name: Live suite
        run: npm run test:integration
